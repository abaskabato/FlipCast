<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon.svg">
    <title>FLIPCAST — flip it open, tune the world</title>
    <meta name="description" content="A 3D flip phone that tunes thousands of live radio stations and podcasts from around the world. No accounts, no signup — just flip it open and press play.">
    <meta property="og:title" content="FLIPCAST">
    <meta property="og:description" content="Live radio + podcasts from around the world, on a 3D flip phone.">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#06060d">
    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three.module.js",
            "three/addons/": "./vendor/addons/"
        }
    }
    </script>
</head>
    <body>
    <header class="site-header">
        <div class="header-left">
            <a class="brand" href="/"><img class="brand-mark" src="/icon.svg" alt="" width="24" height="24">FLIP<span>CAST</span></a>
            <div class="hero-copy">
                <p class="eyebrow">Live · worldwide · free</p>
                <h1>Flip it open. Tune the world.</h1>
            </div>
        </div>
        <div class="header-right">
            <div id="newsletter" class="newsletter-hdr">
                <button id="newsletterToggle" class="nl-btn" aria-expanded="false">
                    <span>📡</span>
                    <span class="nl-label">Newsletter</span>
                </button>
                <form id="newsletterForm" class="nl-form">
                    <p class="nl-pitch">One email a week on living with less screen. Flip phones, dumb phone tips, and the art of disconnecting.</p>
                    <input
                        type="email"
                        name="email"
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                        class="nl-input"
                    />
                    <button type="submit" class="nl-submit">Subscribe</button>
                    <p class="nl-hint">No spam. Unsubscribe anytime.</p>
                </form>
            </div>
        </div>
    </header>

    <!-- ===== full-screen 3D flip phone ===== -->
    <section class="hero">
        <canvas id="scene"></canvas>

        <div class="band-toggle" role="tablist" aria-label="listening band">
            <span class="band-slider" aria-hidden="true"></span>
            <button id="bandRadio" class="band on" role="tab" aria-pressed="true">📻 Radio</button>
            <button id="bandPods" class="band" role="tab" aria-pressed="false">🎙 Podcasts</button>
        </div>
        <div class="hero-controls">
            <div class="actions">
                <button id="searchBtn" class="btn primary">🔍 Search</button>
                <button id="shareBtn" class="flip-btn" title="Copy a link to what's playing">🔗 Share</button>
                <button id="stickBtn" class="flip-btn" title="Pin the phone in place">📌 Pin</button>
                <button id="flipBtn" class="flip-btn"><span class="dot"></span> Open / Close</button>
                <button id="toolsBtn" class="flip-btn">🧰 Tools</button>
            </div>
        </div>

        <div id="toolsPanel" class="tools-panel">
            <div class="tools-inner">
                <div class="tool-pomo">
                    <div class="pomo-display" id="pomoDisplay">25:00</div>
                    <div class="pomo-status" id="pomoStatus">WORK</div>
                    <div class="pomo-controls">
                        <button class="pomo-btn" id="pomoStart">START</button>
                        <button class="pomo-btn" id="pomoReset">RESET</button>
                    </div>
                </div>
                <div class="tool-scratch">
                    <textarea id="scratchArea" placeholder="quick notes..." rows="3"></textarea>
                </div>
            </div>
        </div>

        <div id="loader" class="loader">
            <div class="loader-dots"><span></span><span></span><span></span></div>
            <div>Warming up the tubes</div>
        </div>
    </section>

    <footer class="site-footer">
        built with coffee in seattle by <a href="https://abaskabato.github.io" target="_blank" rel="noopener">abas</a>
    </footer>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/site.js"></script>
    <script>
        // ===== Pomodoro Timer =====
        const WORK = 25 * 60, BREAK = 5 * 60;
        let t = WORK, running = false, interval = null, phase = 'work';
        const d = document.getElementById('pomoDisplay');
        const s = document.getElementById('pomoStatus');
        const b = document.getElementById('pomoStart');
        const r = document.getElementById('pomoReset');

        function fmt(sec) {
            return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
        }
        function upd() { d.textContent = fmt(t); s.textContent = phase === 'work' ? 'WORK' : 'BREAK'; }
        function tick() {
            if (t <= 0) { phase = phase === 'work' ? 'break' : 'work'; t = phase === 'work' ? WORK : BREAK; upd(); return; }
            t--; upd();
        }
        function toggle() {
            if (running) { clearInterval(interval); running = false; b.textContent = 'START'; }
            else { interval = setInterval(tick, 1000); running = true; b.textContent = 'PAUSE'; }
        }
        function reset() { clearInterval(interval); running = false; phase = 'work'; t = WORK; b.textContent = 'START'; upd(); }
        b.addEventListener('click', toggle);
        r.addEventListener('click', reset);

        // ===== Scratch Pad =====
        const ta = document.getElementById('scratchArea');
        const saved = localStorage.getItem('flipnotes');
        if (saved) ta.value = saved;
        ta.addEventListener('input', function () { localStorage.setItem('flipnotes', this.value); });

        // ===== Tools Panel Toggle =====
        const toolsBtn = document.getElementById('toolsBtn');
        const toolsPanel = document.getElementById('toolsPanel');
        toolsBtn.addEventListener('click', function () {
            toolsPanel.classList.toggle('open');
            this.classList.toggle('on');
        });
    </script>
</body>
</html>
