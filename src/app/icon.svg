<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Flipcast mark: an F built from the three formats it makes, a 9:16 stem
       with a play cut-out, a 16:9 arm and a 1:1 square. Every edge sits on
       the 16 px pixel grid (multiples of 4) so it stays crisp as a favicon.
       Keep in sync with src/components/flipcast/logo-mark.tsx. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset=".55" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <path fill="#fff" fill-rule="evenodd" d="M11 8h14a3 3 0 0 1 3 3v42a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3zM13 24v16l11-8z"/>
  <rect x="32" y="8" width="24" height="12" rx="3" fill="#fff"/>
  <rect x="32" y="24" width="12" height="12" rx="3" fill="#fff"/>
</svg>
